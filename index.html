<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tengrui Han - 个人主页</title>
  <style>
    /* === 基础：全局排版 (body) === */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1d1d1f;
    }

    /* === 核心：卡片容器 (card) === */
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 18px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* === 卡片内容：图片、文字 === */
    .card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 25px;
    }

    .card h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      font-weight: 600;
    }

    .card p {
      margin: 0 0 30px 0;
      color: #86868b;
      line-height: 1.6;
    }

    /* === 纯 CSS 交互的核心部分 === */

    /* 1. 包含按钮和隐藏内容的“互动区”容器 */
    .interact-area {
      position: relative;
      /* 关键：把溢出的内容藏起来，就像抽屉一样 */
      overflow: hidden; 
      /* 设置一个基础高度，刚好装下默认的按钮 */
      height: 50px;
      /* 所有的变化都进行平滑过渡 */
      transition: height 0.3s ease;
    }

    /* 2. 交互区内部的按钮 */
    .btn {
      display: inline-block;
      background-color: #0071e3;
      color: white;
      padding: 12px 24px;
      border-radius: 980px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      /* 保证按钮撑开它的基础高度 */
      height: 24px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #0077ed;
    }

    /* 3. 默认隐藏的额外提示信息 */
    .hint-text {
      color: #86868b;
      font-size: 14px;
      padding-top: 15px; /* 在按钮下方加一点点间距 */
      /* 关键：默认设为半透明，并在 CSS 过渡中改变透明度 */
      opacity: 0;
      transition: opacity 0.3s ease 0.1s; /* 加个延迟，让高度先变化 */
    }

    /* === 4. 触发交互的 CSS 魔术时刻 === */
    /* 当鼠标“悬停”在交互区上时，它的高度会自动撑大 */
    .interact-area:hover {
      height: 90px; /* 卡片高度被撑开，容纳提示文字 */
    }

    /* 当鼠标“悬停”在交互区上时，内部的提示文字变透明为不透明 */
    .interact-area:hover .hint-text {
      opacity: 1;
    }

  </style>
</head>
<body>

  <div class="card">
    
    <!-- 头像 -->
    <img src="avatar.jpg" alt="Tengrui Han 的头像">
    
    <!-- 个人介绍文字 -->
    <h1>Tengrui Han</h1>
    <p>Terry 牛逼</p>

    <!-- === 【纯 CSS 交互：优雅抽屉】 === -->
    <div class="interact-area">
      
      <!-- 按钮 -->
      <a href="https://github.com/" class="btn">访问 GitHub</a>
      
      <!-- 鼠标悬停时平滑滑出的额外文字 -->
      <div class="hint-text">欢迎查阅我的所有个人项目与开源代码。</div>

    </div>

  </div>

</body>
</html>
